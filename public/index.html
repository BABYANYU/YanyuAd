<main class="page-shell">
  <h1 class="sr-only">Surge 模块目录</h1>
  <div class="workspace">
    <aside class="category-sidebar" aria-label="模块分类"><div class="sidebar-inner"><p class="sidebar-label">分类</p><nav id="categories" class="categories" aria-label="按用途筛选模块"></nav></div></aside>
    <section class="library" id="library" aria-label="模块目录">
      <label class="mobile-category-picker"><span>分类</span><select id="category-select" aria-label="选择模块分类"></select></label>
      <label class="search"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/></svg><input id="search" type="search" placeholder="搜索模块名称、描述…" aria-label="搜索模块名称或描述" autocomplete="off"></label>

      <div class="grid" id="grid" aria-live="polite"></div>
      <p id="empty" class="empty" hidden>没有匹配的模块，试试其他关键词。</p>
      <p class="error" id="error" role="alert" hidden></p>
      <nav class="pagination" id="pagination" aria-label="模块列表分页" hidden><span id="page-info"></span><div><button id="prev" class="page-button" type="button" aria-label="上一页">←</button><span id="page-number"></span><button id="next" class="page-button" type="button" aria-label="下一页">→</button></div></nav>
    </section>
  </div>
  <footer><span id="sync"></span><span class="copyright">© <span id="copyright-year">2026</span> YANYU</span></footer>
