<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="description" content="YanyuAd，面向 Surge 的插件转换与订阅目录。"><title>YanyuAd · Surge 插件仓库</title><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="header"><a class="brand" href="/" id="home" aria-label="YanyuAd 首页"><svg viewBox="0 0 36 36" width="34" height="34" aria-hidden="true"><rect width="36" height="36" rx="10" fill="#007aff"/><path d="M10 10l8 10 8-10M18 20v8" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></a><div class="heading"><h1>YanyuAd</h1><p>Surge 插件仓库</p></div><button id="about" class="icon-button" aria-label="关于与来源">i</button></div></header>
<main><section class="notice">Loon 插件自动转换目录 · 保留原作者署名 · 仅供非商业学习与测试</section><div class="search"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="搜索插件名称或标签…" aria-label="搜索插件"><button id="clear" aria-label="清空搜索" hidden>×</button></div>
<div class="toolbar"><div class="pills" id="sorts"><button data-sort="default" class="selected">默认排序</button><button data-sort="name">名称排序</button><button data-sort="date">最近更新</button></div><label class="switch"><input type="checkbox" id="all"><span>显示完整仓库</span></label></div><div class="categories" id="categories"></div><div class="results"><h2 id="count">正在加载…</h2><select id="compat" aria-label="兼容状态"><option value="all">全部状态</option><option value="converted">已转换</option><option value="unsupported">暂不支持</option><option value="unavailable">来源异常</option></select></div>
<div class="grid" id="grid" aria-live="polite"></div><div id="empty" hidden>没有匹配的插件</div><p class="error" id="error" hidden></p><footer><span id="sync">正在读取同步状态</span><a href="/sources.html">来源与许可</a></footer></main>
<dialog id="details"><button id="close" class="dialog-close" aria-label="关闭">×</button><div id="detail-body"></div></dialog><div id="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
